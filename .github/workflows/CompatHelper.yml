name: CompatHelper
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
# Without these, CompatHelper inherits the repository default workflow permission. Where that
# default is read-only, the run succeeds but can neither push a branch nor open the pull request,
# so the only symptom is that compat bumps silently stop arriving.
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - name: Pkg.add("CompatHelper")
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: CompatHelper.main()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
        run: julia -e 'using CompatHelper; CompatHelper.main()'
