name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref != 'refs/heads/main') || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

env:
  PYTHON: ~

jobs:
  # Temporary coverage comparison on PR #4. Restore the full matrix before merging.
  test:
    name: ${{ matrix.name }}
    env:
      # Julia's path-list separator is platform-specific.
      JULIA_LOAD_PATH: ${{ startsWith(matrix.os, 'windows-') && '@;@stdlib' || '@:@stdlib' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Julia latest - Linux - 1 thread
            version: '1'
            os: ubuntu-latest
            arch: x64
            threads: '1'
            coverage: true

    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Prepare isolated test environment
        shell: julia --startup-file=no --color=yes {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          workspace = ENV["GITHUB_WORKSPACE"]
          include(joinpath(workspace, ".github", "ci", "prepare-tests.jl"))
          project = prepare_tests(; root=workspace)
          open(ENV["GITHUB_ENV"], "a") do io
              println(io, "H2FACTORY_TEST_PROJECT=", project)
          end
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ env.H2FACTORY_TEST_PROJECT }}
      - name: Run package tests
        shell: julia --startup-file=no --color=yes {0}
        run: |
          using LinearAlgebra
          workspace = ENV["GITHUB_WORKSPACE"]
          project = ENV["H2FACTORY_TEST_PROJECT"]
          coverage = ENV["H2FACTORY_TEST_COVERAGE"] == "user" ? "@$workspace" : "none"
          tests = joinpath(workspace, "test", "runtests.jl")
          @info "Test configuration" julia=VERSION threads=Threads.nthreads() blas_threads=BLAS.get_num_threads() coverage
          command = `$(Base.julia_cmd()) --startup-file=no --check-bounds=yes --depwarn=yes --code-coverage=$coverage --project=$project --color=yes $tests`
          if Sys.islinux() && isfile("/usr/bin/time")
              command = `/usr/bin/time -v $command`
          elseif Sys.islinux()
              @warn "GNU time is unavailable; resource totals will not be recorded"
          end
          run(Cmd(command; dir=workspace))
        env:
          H2FACTORY_TEST_COVERAGE: ${{ matrix.coverage && 'user' || 'none' }}
          JULIA_NUM_THREADS: ${{ matrix.threads }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v6
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
